[[faq]]
q = "A inspeção de gás é obrigatória?"
a = "Sim, prevista na Lei Estadual nº 6.890/2014."

[[faq]]
q = "De quanto em quanto tempo é feita?"
a = "O ciclo é de 5 anos."

[[faq]]
q = "Preciso pagar novamente pela reinspeção?"
a = "Na Enquesta, não — já está incluída no valor contratado."

[[faq]]
q = "A Enquesta atende Zona Sul, Barra e Recreio?"
a = "Sim, e outras localidades — consulte disponibilidade para o seu bairro."

[[naturgy_steps]]
n = "1"
title = "Verifique o prazo indicado"
body = "Confirme até quando a inspeção precisa ser realizada para evitar suspensão do fornecimento."

[[naturgy_steps]]
n = "2"
title = "Agende a inspeção com um Organismo Acreditado"
body = "A inspeção deve ser feita por um Organismo de Inspeção Acreditado pela CGCRE/Inmetro, como a Enquesta."

[[naturgy_steps]]
n = "3"
title = "Corrija pendências, se houver"
body = "Se o laudo apontar irregularidades, a reinspeção — pelo mesmo Organismo — confirma que tudo foi corrigido."
